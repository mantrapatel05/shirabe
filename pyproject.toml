[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["graph.py", "state.py", "evaluate.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
